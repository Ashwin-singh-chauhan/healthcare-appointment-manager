spring.application.name=healthcare-appointment-manager

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthcare_manager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

frontend.url=${FRONTEND_URL:http://localhost:5173}

jwt.secret=${JWT_SECRET:healthcare-manager-super-secret-key-change-this-123456789}

spring.security.debug=false
logging.level.org.springframework.security=INFO